<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

#container {
  width: 320px;
  padding: 10px;
  background: rgba(0,0,0,0.75);
  border: 2px solid #b00000;
}

#vida-texto {
  text-align: center;
  font-size: 18px;
  margin-bottom: 6px;
}

#barra-bg {
  width: 100%;
  height: 22px;
  background: #222;
  border: 1px solid #555;
}

#barra-vida {
  height: 100%;
  width: 100%;
  background: red;
  transition: width 0.4s ease;
}
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Vida: -- / --</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// 🔴 LINK CSV (TEM QUE TERMINAR EM output=csv)
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?output=csv";

// ===============================
// FUNÇÕES DE SEGURANÇA
// ===============================
function getNumberSafe(value, fallback = 0) {
  if (!value) return fallback;

  const cleaned = value
    .toString()
    .replace('%', '')
    .replace(',', '.')
    .trim();

  const num = Number(cleaned);
  return isNaN(num) ? fallback : num;
}

// ===============================
// ATUALIZA VIDA
// ===============================
async function atualizarVida() {
  try {
    const response = await fetch(SHEET_URL + "&_=" + Date.now());
    const text = await response.text();

    const linhas = text.split('\n');

    // 🔧 LINHA DA VIDA (ajustada ao CSV que você mandou)
    // VIDA MÁXIMA = coluna 1
    // VIDA ATUAL (%) = coluna 2
    const linhaVida = linhas.find(l => l.includes('PONTOS DE VIDA'));

    if (!linhaVida) return;

    const dados = linhaVida.split(',');

    const vidaMax = getNumberSafe(dados[1], 1);
    const vidaPercent = getNumberSafe(dados[2], 100);

    const vidaAtual = Math.round((vidaPercent / 100) * vidaMax);
    const porcentagemBarra = Math.max(0, Math.min(100, (vidaAtual / vidaMax) * 100));

    document.getElementById('vida-texto').innerText =
      `Vida: ${vidaAtual} / ${vidaMax}`;

    document.getElementById('barra-vida').style.width =
      porcentagemBarra + '%';

  } catch (e) {
    console.error("Erro ao ler CSV", e);
  }
}

// Atualiza a cada 1s
setInterval(atualizarVida, 1000);
atualizarVida();
</script>
</body>
</html>
