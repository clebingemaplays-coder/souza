<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

#container {
  width: 320px;
  padding: 10px;
  background: rgba(0,0,0,0.75);
  border: 2px solid #b00000;
}

#vida-texto {
  text-align: center;
  font-size: 18px;
  margin-bottom: 6px;
}

#barra-bg {
  width: 100%;
  height: 22px;
  background: #222;
  border: 1px solid #555;
}

#barra-vida {
  height: 100%;
  width: 100%;
  background: red;
  transition: width 0.4s ease;
}
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Vida: -- / --</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?output=csv";

async function atualizarVida() {
  try {
    const response = await fetch(SHEET_URL + "&_=" + Date.now());
    const text = await response.text();

   const linhas = text.split("\n").map(l => l.split(";"));

  const vidaMax = Number(linhas[9][1]); // B10:C10
  const dano    = Number(linhas[9][3]); // D10:E10
    

    const atual = Math.max(0, vidaMax - dano);
    const porcentagem = (atual / vidaMax) * 100;

    document.getElementById("vida-texto").innerText =
      `Vida: ${atual} / ${vidaMax}`;

    document.getElementById("barra-vida").style.width =
      porcentagem + "%";

  } catch (e) {
    console.error("Erro ao ler planilha", e);
  }
}

setInterval(atualizarVida, 1000);
atualizarVida();
</script>
</body>
</html>
