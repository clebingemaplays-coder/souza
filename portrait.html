<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

#container {
  width: 320px;
  padding: 10px;
  background: rgba(0,0,0,0.75);
  border: 2px solid #b00000;
}

#vida-texto {
  text-align: center;
  font-size: 18px;
  margin-bottom: 6px;
}

#barra-bg {
  width: 100%;
  height: 22px;
  background: #222;
  border: 1px solid #555;
}

#barra-vida {
  height: 100%;
  width: 100%;
  background: red;
  transition: width 0.4s ease;
}
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Vida: carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?output=csv";

function toNumber(v) {
  if (!v) return 0;
  return Number(v.replace('%', '').replace(',', '.')) || 0;
}

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    const text = await res.text();
    const linhas = text.split('\n');

    // 🔴 Encontrar o bloco de VIDA
    const idx = linhas.findIndex(l => l.includes('PONTOS DE VIDA'));
    if (idx === -1) return;

    // Linha dos valores reais (logo abaixo)
    const valores = linhas[idx + 4].split(',');

    const vidaMax = toNumber(valores[1]); // 14
    const dano = toNumber(valores[2]);    // 0

    if (vidaMax <= 0) return;

    const vidaAtual = Math.max(0, vidaMax - dano);
    const pct = (vidaAtual / vidaMax) * 100;

    document.getElementById('vida-texto').innerText =
      `Vida: ${vidaAtual} / ${vidaMax}`;

    document.getElementById('barra-vida').style.width =
      pct + '%';

  } catch (e) {
    console.error(e);
  }
}

setInterval(atualizarVida, 1000);
atualizarVida();
</script>
</body>
</html>
