<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

#container {
  width: 320px;
  padding: 10px;
  background: rgba(0,0,0,0.75);
  border: 2px solid #b00000;
}

#vida-texto {
  text-align: center;
  font-size: 18px;
  margin-bottom: 6px;
}

#barra-bg {
  width: 100%;
  height: 22px;
  background: #222;
  border: 1px solid #555;
}

#barra-vida {
  height: 100%;
  width: 100%;
  background: red;
  transition: width 0.4s ease;
}
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Vida: -- / --</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
const SHEET_URL =
"COLE_AQUI_SEU_LINK_CSV";

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    const csv = await res.text();
    const linhas = csv.split('\n');

    // Aba OBS vem primeiro
    const VidaMax = Number(linhas[1].split(',')[1]);
      const Dano = Number(linhas[2].split(',')[1]);

    if (!vidaMax || vidaMax <= 0) return;

    const atual = Math.max(0, vidaMax - dano);
    const pct = (atual / vidaMax) * 100;

    document.getElementById("vida-texto").innerText =
      `Vida: ${atual} / ${vidaMax}`;

    document.getElementById("barra-vida").style.width =
      pct + "%";

  } catch (e) {
    console.error("Erro ao atualizar vida:", e);
  }
}

setInterval(atualizarVida, 1000);
atualizarVida();
</script>
</body>
</html>
