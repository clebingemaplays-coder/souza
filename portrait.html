<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG</title>

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
  color: white;
}

#container {
  width: 320px;
  padding: 10px;
  background: rgba(0,0,0,0.75);
  border: 2px solid #b00000;
}

#vida-texto {
  text-align: center;
  font-size: 18px;
  margin-bottom: 6px;
}

#barra-bg {
  width: 100%;
  height: 22px;
  background: #222;
  border: 1px solid #555;
}

#barra-vida {
  height: 100%;
  width: 100%;
  background: red;
  transition: width 0.4s ease;
}
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Vida: -- / --</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?output=csv";

function toNum(v) {
  if (!v) return 0;
  return Number(v.replace(/[^\d]/g, ""));
}

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    const text = await res.text();

    const linhas = text.split("\n");

    let vidaMax = 0;
    let dano = 0;

    for (let i = 0; i < linhas.length; i++) {
      if (linhas[i].includes(",MÁXIMA,,DANO")) {
        const dados = linhas[i + 1].split(",");

        vidaMax = toNum(dados[1]); // Vida Máxima
        dano    = toNum(dados[3]); // Dano
        break;
      }
    }

    const atual = Math.max(0, vidaMax - dano);
    const pct = vidaMax ? (atual / vidaMax) * 100 : 0;

    document.getElementById("vida-texto").innerText =
      `Vida: ${atual} / ${vidaMax}`;

    document.getElementById("barra-vida").style.width =
      pct + "%";

  } catch (e) {
    console.error(e);
    document.getElementById("vida-texto").innerText = "Erro";
  }
}

setInterval(atualizarVida, 1000);
atualizarVida();
</script>
</body>
</html>
