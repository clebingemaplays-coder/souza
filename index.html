<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Lista Negra</title>
<style>
  /* --- ESTILOS --- */
  body { 
    margin: 0; padding: 0;
    background: transparent; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; overflow: hidden; 
  }
  
  #container {
    width: 320px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.9);
    border: 2px solid #b00000;
    border-radius: 8px; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.8);
  }

  #vida-texto {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0px #000;
  }

  #barra-bg {
    width: 100%;
    height: 26px;
    background: #222;
    border: 2px solid #000;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  #barra-vida {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #ff3333 0%, #aa0000 100%);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    transition: width 0.4s ease-out; 
  }
</style>
</head>

<body>

<div id="container">
  <div id="vida-texto">Carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// SEU LINK JÁ CONFIGURADO:
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];

  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

// --- VARIÁVEIS DE CONTROLE ---
let vidaNaTela = -1;      // O valor que estamos mostrando agora
let valorIgnorado = -1;   // O valor antigo ("fantasma") que não queremos aceitar de volta
let tempoIgnorar = 0;     // Até quando vamos ignorar o valor antigo

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    
    if (res.ok) {
      const csv = await res.text();
      const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP", "Total", "Maximo"]);
      let dano = encontrarNumero(csv, ["Dano", "Ferimento", "Machucado", "Atual"]);

      if (vidaMax !== null) {
        if (dano === null) dano = 0;
        
        // Calcula a vida que veio do Google
        const vidaLida = Math.max(0, vidaMax - dano);

        // --- LÓGICA DA LISTA NEGRA ---
        
        // 1. Se a vida lida for diferente do que está na tela
        if (vidaLida !== vidaNaTela) {
            
            // Verifica se esse valor está na lista negra (é um fantasma?)
            const ehFantasma = (vidaLida === valorIgnorado && Date.now() < tempoIgnorar);

            if (!ehFantasma) {
                // Se NÃO for fantasma, atualiza a tela AGORA!
                const pct = (vidaLida / vidaMax) * 100;
                document.getElementById("vida-texto").innerText = `VIDA: ${vidaLida} / ${vidaMax}`;
                document.getElementById("barra-vida").style.width = pct + "%";
                
                // Coloca o valor antigo na lista negra por 8 segundos
                valorIgnorado = vidaNaTela; 
                tempoIgnorar = Date.now() + 8000;

                // Atualiza o valor oficial
                vidaNaTela = vidaLida;
                
                console.log(`Atualizado para ${vidaLida}. Bloqueando ${valorIgnorado} por 8s.`);
            } else {
                console.log(`Ignorando rollback para ${vidaLida}`);
            }
        }
      }
    }
  } catch (e) {
    console.error(e); 
  } finally {
    // Verifica a cada 1 segundo (rápido)
    setTimeout(atualizarVida, 1000); 
  }
}

atualizarVida();
</script>
</body>
</html>
