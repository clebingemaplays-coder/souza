<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG Final Anti-Ghost</title>
<style>
  /* CONFIGURAÇÃO VISUAL */
  body { 
    margin: 0; 
    padding: 0;
    background: transparent; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; 
    overflow: hidden; 
  }
  
  /* Caixa principal */
  #container {
    width: 320px; /* Largura da barra */
    padding: 10px;
    background: rgba(0, 0, 0, 0.85); /* Fundo escuro */
    border: 2px solid #b00000; /* Borda vermelha */
    border-radius: 8px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
  }

  /* Texto da Vida */
  #vida-texto {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0px #000;
  }

  /* Fundo da Barra (Cinza escuro) */
  #barra-bg {
    width: 100%;
    height: 24px;
    background: #2a2a2a;
    border: 2px solid #111;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  /* A Barra Vermelha (Vida) */
  #barra-vida {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%);
    box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }
</style>
</head>

<body>

<div id="container">
  <div id="vida-texto">Carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// ======================================================
// SEU LINK (NÃO PRECISA MEXER):
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";
// ======================================================

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];

  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

// Variável para evitar atualização desnecessária
let ultimaVidaAtual = -1;
let ultimaVidaMax = -1;

async function atualizarVida() {
  try {
    // Busca a planilha
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    
    if (res.ok) {
      const csv = await res.text();
      const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP", "Total", "Maximo"]);
      let dano = encontrarNumero(csv, ["Dano", "Ferimento", "Machucado", "Atual"]);

      if (vidaMax !== null) {
        if (dano === null) dano = 0;
        const atual = Math.max(0, vidaMax - dano);

        // Só atualiza a tela se o número realmente mudou (evita piscadas)
        if (atual !== ultimaVidaAtual || vidaMax !== ultimaVidaMax) {
           const pct = (atual / vidaMax) * 100;
           document.getElementById("vida-texto").innerText = `VIDA: ${atual} / ${vidaMax}`;
           document.getElementById("barra-vida").style.width = pct + "%";
           
           // Salva os valores atuais
           ultimaVidaAtual = atual;
           ultimaVidaMax = vidaMax;
        }
      }
    }
  } catch (e) {
    console.error(e); 
  } finally {
    // TRUQUE: Só agenda a próxima busca DEPOIS que essa terminar.
    // Isso impede que duas buscas aconteçam ao mesmo tempo e embaralhem os dados.
    setTimeout(atualizarVida, 2000); 
  }
}

// Inicia o processo
atualizarVida();
</script>
</body>
</html>
