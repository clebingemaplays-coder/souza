<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Estável</title>
<style>
  /* CONFIGURAÇÃO VISUAL */
  body { 
    margin: 0; 
    padding: 0;
    background: transparent; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; 
    overflow: hidden; 
  }
  
  #container {
    width: 320px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #b00000;
    border-radius: 8px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.5);
  }

  #vida-texto {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0px #000;
  }

  #barra-bg {
    width: 100%;
    height: 24px;
    background: #2a2a2a;
    border: 2px solid #111;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  #barra-vida {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%);
    box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  }
</style>
</head>

<body>

<div id="container">
  <div id="vida-texto">Carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// SEU LINK JÁ CONFIGURADO:
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];

  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

// VARIÁVEIS DO SISTEMA DE ESTABILIDADE
let naTelaVida = -1;      // O que está aparecendo agora
let candidatoVida = -1;   // O novo valor que chegou
let repeticoes = 0;       // Quantas vezes o novo valor se repetiu

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    
    if (res.ok) {
      const csv = await res.text();
      const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP", "Total", "Maximo"]);
      let dano = encontrarNumero(csv, ["Dano", "Ferimento", "Machucado", "Atual"]);

      if (vidaMax !== null) {
        if (dano === null) dano = 0;
        
        // Calcula a vida atual baseada na planilha
        const vidaLida = Math.max(0, vidaMax - dano);

        // --- LÓGICA DE PROTEÇÃO CONTRA ROLLBACK ---
        
        // Se a vida lida é DIFERENTE do que está na tela
        if (vidaLida !== naTelaVida) {
            
            // Se essa vida lida é igual à "candidata" da vez anterior
            if (vidaLida === candidatoVida) {
                repeticoes++; // Confirmação +1
            } else {
                candidatoVida = vidaLida; // Novo candidato
                repeticoes = 1; // Primeira vez que vemos ele
            }

            // Só atualiza se o MESMO valor vier 2 vezes seguidas
            if (repeticoes >= 2) {
                const pct = (vidaLida / vidaMax) * 100;
                
                document.getElementById("vida-texto").innerText = `VIDA: ${vidaLida} / ${vidaMax}`;
                document.getElementById("barra-vida").style.width = pct + "%";
                
                // Atualiza o valor oficial da tela
                naTelaVida = vidaLida;
                repeticoes = 0; 
            }
        } else {
            // Se o valor lido for igual ao da tela, reseta contadores
            repeticoes = 0;
            candidatoVida = -1;
        }
      }
    }
  } catch (e) {
    console.error(e); 
  } finally {
    // Tenta de novo a cada 1.5 segundos
    // Isso significa que vai levar uns 3 segundos para atualizar na live,
    // mas garante que não vai ficar piscando.
    setTimeout(atualizarVida, 1500); 
  }
}

atualizarVida();
</script>
</body>
</html>
