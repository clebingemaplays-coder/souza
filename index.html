<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Estilo Ordem</title>
<style>
  /* LINK DA FOTO DO SEU PERSONAGEM: */
  /* Troque o link abaixo pelo da sua imagem */
  :root {
    --char-image: url('https://i.imgur.com/8Q5gq0d.png'); /* Exemplo */
  }

  body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Arial Black', 'Arial Bold', Impact, sans-serif; }

  /* Container Principal */
  #portrait-container {
    display: flex;
    align-items: center;
    width: 500px;
    height: 130px;
    position: relative;
  }

  /* Círculo do Personagem */
  #char-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #1a1a1a;
    background-image: var(--char-image);
    background-size: cover;
    background-position: center;
    position: absolute;
    left: 0;
    z-index: 10; /* Fica na frente das barras */
    box-shadow: 3px 0 10px rgba(0,0,0,0.5);
  }

  /* Container das Barras */
  #bars-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px; /* Espaço entre as barras */
    margin-left: 70px; /* Empurra para a direita do círculo */
    width: 420px;
    padding: 10px 10px 10px 60px; /* Espaço interno */
    background: rgba(0,0,0,0.8); /* Fundo escuro atrás das barras */
    border-radius: 0 10px 10px 0;
    border: 2px solid #1a1a1a;
    border-left: none; /* Remove a borda da esquerda que fica atrás do círculo */
  }

  /* Estilo Comum das Barras */
  .bar-wrapper {
    width: 100%;
    height: 35px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    border: 2px solid #000;
  }

  .bar-fill {
    height: 100%;
    width: 100%; /* Começa cheio */
    position: absolute;
    top: 0; left: 0;
    transition: width 0.5s ease-out;
  }

  /* Cores das Barras */
  #hp-bar .bar-fill { background: linear-gradient(90deg, #990000, #ff0000); }
  #sp-bar .bar-fill { background: linear-gradient(90deg, #000099, #0000ff); }

  /* Texto sobre as Barras */
  .bar-text {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 22px;
    font-weight: 900;
    /* Contorno preto na fonte */
    text-shadow: 
       2px  2px 0 #000, -2px  2px 0 #000, 
      -2px -2px 0 #000,  2px -2px 0 #000,
       0px  3px 3px rgba(0,0,0,0.8);
    z-index: 5;
  }
</style>
</head>

<body>

<div id="portrait-container">
  <div id="char-circle"></div>
  
  <div id="bars-container">
    <div id="hp-bar" class="bar-wrapper">
      <div class="bar-fill" id="hp-fill"></div>
      <div class="bar-text" id="hp-text">--/--</div>
    </div>
    
    <div id="sp-bar" class="bar-wrapper">
      <div class="bar-fill" id="sp-fill"></div>
      <div class="bar-text" id="sp-text">--/--</div>
    </div>
  </div>
</div>

<script>
// SEU LINK JÁ CONFIGURADO:
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];
  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

// --- SISTEMA DE LISTA NEGRA (ANTI-ROLLBACK) PARA 2 BARRAS ---
const estado = {
  hp: { atual: -1, max: -1, ignorado: -1, tempoIgnorar: 0 },
  sp: { atual: -1, max: -1, ignorado: -1, tempoIgnorar: 0 }
};

function atualizarBarra(tipo, valorAtual, valorMax) {
  const s = estado[tipo]; // Pega o estado (hp ou sp)
  
  // Se o valor mudou e não é um fantasma ignorado
  if (valorAtual !== s.atual) {
    const ehFantasma = (valorAtual === s.ignorado && Date.now() < s.tempoIgnorar);
    
    if (!ehFantasma) {
        // Atualiza a tela
        const pct = (valorAtual / valorMax) * 100;
        document.getElementById(`${tipo}-text`).innerText = `${valorAtual}/${valorMax}`;
        document.getElementById(`${tipo}-fill`).style.width = pct + "%";
        
        // Adiciona o valor antigo na lista negra por 8s
        s.ignorado = s.atual;
        s.tempoIgnorar = Date.now() + 150000;
        s.atual = valorAtual;
        s.max = valorMax;
    }
  } else if (valorMax !== s.max) {
      // Se só a vida máxima mudou (raro, mas acontece)
      const pct = (valorAtual / valorMax) * 100;
      document.getElementById(`${tipo}-text`).innerText = `${valorAtual}/${valorMax}`;
      document.getElementById(`${tipo}-fill`).style.width = pct + "%";
      s.max = valorMax;
  }
}

async function loopPrincipal() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    if (res.ok) {
      const csv = await res.text();

      // --- BUSCA VIDA ---
      const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP"]);
      let dano = encontrarNumero(csv, ["DanoVida", "Dano", "Ferimento"]);
      if (dano === null) dano = 0;
      if (vidaMax !== null) {
          atualizarBarra('hp', Math.max(0, vidaMax - dano), vidaMax);
      }

      // --- BUSCA SANIDADE/PE ---
      const sanMax = encontrarNumero(csv, ["SanidadeMax", "Sanidade", "ManaMax", "Mana", "PE", "Pontos"]);
      let danoSan = encontrarNumero(csv, ["DanoSanidade", "DanoMana", "Gasto"]);
      if (danoSan === null) danoSan = 0;
      if (sanMax !== null) {
          atualizarBarra('sp', Math.max(0, sanMax - danoSan), sanMax);
      }
    }
  } catch (e) { console.error(e); } 
  finally { setTimeout(loopPrincipal, 400); } // Repete a cada 1s
}

loopPrincipal();
</script>
</body>
</html>
