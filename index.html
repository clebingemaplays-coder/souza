<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Final</title>
<style>
  /* === CONFIGURAÇÃO DA IMAGEM === */
  :root {
    /* Troque o link aqui se a imagem sumir */
    --char-image: url('https://i.imgur.com/8Q5gq0d.png'); 
  }

  body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Arial Black', Impact, sans-serif; }

  /* --- ESTRUTURA VISUAL --- */
  #portrait-container {
    display: flex;
    align-items: center;
    width: 500px;
    height: 140px; /* Altura ajustada para caber certinho */
    position: relative;
  }

  #char-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #1a1a1a;
    background-image: var(--char-image);
    background-size: cover;
    background-position: center;
    position: absolute;
    left: 0;
    z-index: 10;
    box-shadow: 3px 0 10px rgba(0,0,0,0.6);
  }

  #bars-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px; 
    margin-left: 70px; 
    width: 420px;
    padding: 10px 10px 10px 60px; 
    background: rgba(0,0,0,0.9);
    border-radius: 0 10px 10px 0;
    border: 2px solid #1a1a1a;
    border-left: none; 
  }

  /* --- BARRAS --- */
  .bar-wrapper {
    width: 100%;
    height: 35px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    border: 2px solid #000;
  }
  
  .bar-fill {
    height: 100%; width: 100%; position: absolute; top: 0; left: 0;
    transition: width 0.3s ease-out; /* Animação suave */
  }
  
  /* Cores (Vermelho e Azul) */
  #hp-bar .bar-fill { background: linear-gradient(90deg, #800000, #ff0000); }
  #sp-bar .bar-fill { background: linear-gradient(90deg, #000080, #0055ff); }

  .bar-text {
    position: absolute; width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    color: white; font-size: 24px; font-weight: 900;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000; z-index: 5;
  }
</style>
</head>

<body>

<div id="portrait-container">
  <div id="char-circle"></div>
  
  <div id="bars-container">
    <div id="hp-bar" class="bar-wrapper">
      <div class="bar-fill" id="hp-fill"></div>
      <div class="bar-text" id="hp-text">...</div>
    </div>
    <div id="sp-bar" class="bar-wrapper">
      <div class="bar-fill" id="sp-fill"></div>
      <div class="bar-text" id="sp-text">...</div>
    </div>
  </div>
</div>

<script>
// ================= CONFIGURAÇÕES =================
const CONFIG = {
    // SEU LINK DA PLANILHA:
    url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv",
    
    // Palavras chaves
    termosVida: ["VidaMax", "Vida Max", "Vida", "HP", "PV"],
    termosDanoVida: ["DanoVida", "Dano", "Ferimento"],
    
    termosSan: ["SanidadeMax", "Sanidade", "ManaMax", "Mana", "PE"],
    termosDanoSan: ["DanoSanidade", "DanoMana", "Gasto"],

    // LÓGICA DE ESTABILIDADE (CONSENSO)
    BUFFER_SIZE: 5,        // Olha as ultimas 5 leituras
    MIN_CONSENSO: 0.6,     // Precisa de 60% de certeza (3 em 5) para mudar
    REFRESH_RATE: 800      // Lê a cada 0.8 segundos
};

// CLASSE JUIZ DE VALOR (Sistema de Votação)
class JuizDeValor {
    constructor(idTexto, idBarra) {
        this.elTexto = document.getElementById(idTexto);
        this.elBarra = document.getElementById(idBarra);

        this.valorAtual = null;
        this.valorMax = null;

        // Buffer = A Memória Recente
        this.buffer = []; 
    }

    processar(novoAtual, novoMax) {
        // 1. Adiciona leitura na memória
        this.buffer.push(novoAtual);
        if (this.buffer.length > CONFIG.BUFFER_SIZE) {
            this.buffer.shift();
        }

        // 2. Conta qual valor apareceu mais vezes
        const contagem = {};
        for (const v of this.buffer) {
            contagem[v] = (contagem[v] || 0) + 1;
        }

        let vencedor = null;
        let votosVencedor = 0;
        
        for (const valor in contagem) {
            if (contagem[valor] > votosVencedor) {
                votosVencedor = contagem[valor];
                vencedor = Number(valor);
            }
        }

        // 3. Verifica se o vencedor tem votos suficientes (Maioria Qualificada)
        const porcentagem = votosVencedor / this.buffer.length;
        const temMaioria = porcentagem >= CONFIG.MIN_CONSENSO;
        const mudou = vencedor !== this.valorAtual;

        // 4. Se mudou e tem maioria, atualiza a tela
        if (mudou && temMaioria) {
            this.valorAtual = vencedor;
            this.valorMax = novoMax;
            this.atualizarTela();
        }
    }

    atualizarTela() {
        if (this.valorMax <= 0) return;
        const pct = Math.max(0, Math.min(100, (this.valorAtual / this.valorMax) * 100));
        this.elTexto.innerText = `${this.valorAtual}/${this.valorMax}`;
        this.elBarra.style.width = pct + "%";
    }
}

const juizHP = new JuizDeValor('hp-text', 'hp-fill');
const juizSP = new JuizDeValor('sp-text', 'sp-fill');

function lerPlanilha(csv, termos) {
  const linhas = csv.split('\n');
  for (const linha of linhas) {
    if (termos.some(t => linha.toLowerCase().includes(t.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const n = Number(p.replace(/[^0-9.-]/g, '').trim());
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

async function loop() {
  try {
    const res = await fetch(CONFIG.url + "&_=" + Date.now());
    if (res.ok) {
        const csv = await res.text();

        // Leitura VIDA
        const vMax = lerPlanilha(csv, CONFIG.termosVida);
        let vDano = lerPlanilha(csv, CONFIG.termosDanoVida) || 0;
        let vAtual = (vMax !== null) ? Math.max(0, vMax - vDano) : 0;

        // Leitura SANIDADE
        const sMax = lerPlanilha(csv, CONFIG.termosSan);
        let sDano = lerPlanilha(csv, CONFIG.termosDanoSan) || 0;
        let sAtual = (sMax !== null) ? Math.max(0, sMax - sDano) : 0;

        // Envia para o Juiz
        if (vMax !== null) juizHP.processar(vAtual, vMax);
        if (sMax !== null) juizSP.processar(sAtual, sMax);
    }
  } catch (e) {
      console.error(e);
  } finally {
      setTimeout(loop, CONFIG.REFRESH_RATE); 
  }
}

loop();
</script>
</body>
</html>
