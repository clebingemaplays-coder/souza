<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG Final</title>
<style>
  /* Remove margens e barra de rolagem */
  body { 
    margin: 0; 
    padding: 0;
    background: transparent; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; 
    overflow: hidden; 
  }
  
  /* Caixa principal */
  #container {
    width: 320px; /* Largura da barra */
    padding: 10px;
    background: rgba(0, 0, 0, 0.85); /* Fundo escuro semi-transparente */
    border: 2px solid #b00000; /* Borda vermelha escura */
    border-radius: 8px; /* Cantos arredondados */
    box-shadow: 0 4px 6px rgba(0,0,0,0.5); /* Sombra suave atrás */
  }

  /* Texto da Vida */
  #vida-texto {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0px #000; /* Sombra no texto para leitura fácil */
  }

  /* Fundo da Barra (Cinza escuro) */
  #barra-bg {
    width: 100%;
    height: 24px;
    background: #2a2a2a;
    border: 2px solid #111;
    border-radius: 4px;
    overflow: hidden; /* Garante que a barra vermelha não vaze */
    position: relative;
  }

  /* A Barra Vermelha (Vida) */
  #barra-vida {
    height: 100%;
    width: 100%; /* Começa cheia */
    background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%); /* Gradiente bonito */
    box-shadow: inset 0 0 5px rgba(0,0,0,0.5); /* Sombra interna para profundidade */
    transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Animação suave */
  }
</style>
</head>

<body>

<div id="container">
  <div id="vida-texto">Carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// ======================================================
// COLE O SEU LINK DA PLANILHA AQUI EMBAIXO (DENTRO DAS ASPAS):
const SHEET_URL = "SEU_LINK_AQUI"; 
// ======================================================

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];

  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    // Verifica se a linha tem algum dos nomes (Vida, HP, VidaMax, etc)
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        // Limpa texto para pegar apenas numeros
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    if (!res.ok) return; // Se der erro silencioso, apenas ignora
    
    const csv = await res.text();

    // Busca inteligente: Procura por VidaMax, Vida, HP, etc.
    const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP", "Total"]);
    
    // Busca inteligente: Procura por Dano, Ferimento, etc.
    let dano = encontrarNumero(csv, ["Dano", "Ferimento", "Machucado"]);

    if (vidaMax === null) return; // Se não achar vida, mantém como está
    if (dano === null) dano = 0;  // Se não achar dano, considera 0

    // Cálculos
    const atual = Math.max(0, vidaMax - dano);
    const pct = (atual / vidaMax) * 100;

    // Atualiza a tela
    document.getElementById("vida-texto").innerText = `VIDA: ${atual} / ${vidaMax}`;
    document.getElementById("barra-vida").style.width = pct + "%";

  } catch (e) {
    console.error(e); // Erros aparecem só no console do programador (F12), não na tela
  }
}

// Atualiza a cada 3 segundos
setInterval(atualizarVida, 3000);
atualizarVida();
</script>
</body>
</html>
