<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Anti-Ghost</title>
<style>
  /* --- ESTILOS --- */
  body { 
    margin: 0; padding: 0;
    background: transparent; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    color: white; overflow: hidden; 
  }
  
  #container {
    width: 320px;
    padding: 10px;
    background: rgba(0, 0, 0, 0.9);
    border: 2px solid #b00000;
    border-radius: 8px; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.8);
  }

  #vida-texto {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0px #000;
  }

  #barra-bg {
    width: 100%;
    height: 26px;
    background: #222;
    border: 2px solid #000;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  #barra-vida {
    height: 100%;
    width: 100%;
    background: linear-gradient(180deg, #ff3333 0%, #aa0000 100%);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    transition: width 0.4s ease-out; /* Animação rápida */
  }
</style>
</head>

<body>

<div id="container">
  <div id="vida-texto">Carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// ======================================================
// SEU LINK DA PLANILHA:
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";
// ======================================================

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];

  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

// VARIÁVEIS DE CONTROLE (ANTI-GHOST)
let vidaNaTela = -1;     
let vidaMaxNaTela = -1;
let candidatoVida = -1;   // O numero novo que está tentando entrar
let repeticoes = 0;       // Quantas vezes o numero novo apareceu seguido
let timestampBloqueio = 0; // Tempo até quando as mudanças estão bloqueadas

async function atualizarVida() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    
    if (res.ok) {
      const csv = await res.text();
      const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP", "Total", "Maximo"]);
      let dano = encontrarNumero(csv, ["Dano", "Ferimento", "Machucado", "Atual"]);

      if (vidaMax !== null) {
        if (dano === null) dano = 0;
        const vidaReal = Math.max(0, vidaMax - dano);

        // --- SISTEMA DE TRAVA DE SEGURANÇA ---
        
        // 1. Estamos em "período de bloqueio"? (5 segundos após uma mudança)
        if (Date.now() < timestampBloqueio) {
            // Se sim, IGNORA qualquer valor que seja diferente do que já está na tela.
            // Isso evita que o "fantasma" do valor antigo mude a barra.
            if (vidaReal !== vidaNaTela) {
                // Console log só pra saber que bloqueou o fantasma
                // console.log("Bloqueando fantasma:", vidaReal);
            }
        } 
        else {
            // 2. Não estamos bloqueados. Verifica se precisa mudar.
            if (vidaReal !== vidaNaTela || vidaMax !== vidaMaxNaTela) {
                
                // Exige confirmação dupla (precisa vir o mesmo valor 2x seguidas)
                if (vidaReal === candidatoVida) {
                    repeticoes++;
                } else {
                    candidatoVida = vidaReal;
                    repeticoes = 1;
                }

                // Se confirmou 2 vezes, atualiza a tela e TRAVA
                if (repeticoes >= 2) {
                    const pct = (vidaReal / vidaMax) * 100;
                    document.getElementById("vida-texto").innerText = `VIDA: ${vidaReal} / ${vidaMax}`;
                    document.getElementById("barra-vida").style.width = pct + "%";
                    
                    vidaNaTela = vidaReal;
                    vidaMaxNaTela = vidaMax;
                    
                    // ATIVA A TRAVA POR 5 SEGUNDOS
                    // Durante 5s, o script vai ignorar qualquer valor antigo que o Google mandar
                    timestampBloqueio = Date.now() + 5000; 
                    repeticoes = 0;
                }
            } else {
                // Se o valor é igual ao da tela, reseta contadores
                repeticoes = 0;
            }
        }
      }
    }
  } catch (e) {
    console.error(e); 
  } finally {
    // Tenta de novo a cada 1 segundo (mais rápido para responder, já que temos a trava)
    setTimeout(atualizarVida, 1000); 
  }
}

atualizarVida();
</script>
</body>
</html>
