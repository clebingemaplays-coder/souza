<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG Debug</title>
<style>
  body { 
    margin: 0; 
    background: transparent; 
    font-family: Arial, sans-serif; 
    color: white; 
    overflow: hidden; 
  }
  
  #container {
    width: 320px;
    padding: 10px;
    background: rgba(0,0,0,0.85);
    border: 2px solid #b00000;
    border-radius: 5px;
  }

  #vida-texto {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
    text-shadow: 1px 1px 2px black;
  }

  #barra-bg {
    width: 100%;
    height: 24px;
    background: #333;
    border: 2px solid #111;
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  #barra-vida {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff0000, #ff4444);
    transition: width 0.5s ease;
  }

  /* Área de mensagens de erro para debug */
  #debug-log {
    margin-top: 5px;
    font-size: 10px;
    color: #ffff00;
    font-family: monospace;
    white-space: pre-wrap;
    background: rgba(0,0,0,0.5);
    padding: 2px;
  }
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Iniciando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
  <div id="debug-log">Log de sistema...</div>
</div>

<script>
// SEU LINK DA PLANILHA
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?output=csv";

// Função para escrever na telinha amarela de debug
function log(msg) {
  const logEl = document.getElementById("debug-log");
  logEl.innerText = msg;
  console.log(msg);
}

function encontrarNumero(csv, palavraChave) {
  const linhas = csv.split('\n');
  const termo = palavraChave.toLowerCase(); 

  for (const linha of linhas) {
    if (linha.toLowerCase().includes(termo)) {
      // Divide por vírgula ou ponto e vírgula
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        // Remove tudo que não for numero ou ponto
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

async function atualizarVida() {
  const textoElement = document.getElementById("vida-texto");
  
  try {
    log("Tentando baixar CSV...");
    
    // O fetch pode falhar aqui se for bloqueado pelo navegador
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    
    if (!res.ok) throw new Error(`Erro HTTP: ${res.status}`);
    
    log("CSV baixado. Lendo...");
    const csv = await res.text();
    
    // Verifica o conteúdo bruto (primeiros 50 caracteres)
    log(`CSV Lido: ${csv.substring(0, 30)}...`);

    const vidaMax = encontrarNumero(csv, "VidaMax");
    const dano = encontrarNumero(csv, "Dano");

    if (vidaMax === null) throw new Error("Não achei 'VidaMax' na planilha");
    // Se não achar dano, assume 0
    const danoFinal = dano === null ? 0 : dano;

    const atual = Math.max(0, vidaMax - danoFinal);
    const pct = (atual / vidaMax) * 100;

    textoElement.innerText = `Vida: ${atual} / ${vidaMax}`;
    document.getElementById("barra-vida").style.width = pct + "%";
    
    log("Atualizado com sucesso!");
    // Limpa o log depois de 2 segundos se deu tudo certo
    setTimeout(() => { document.getElementById("debug-log").innerText = "OK"; }, 2000);

  } catch (e) {
    // Aqui mostra o erro exato na tela
    log("ERRO: " + e.message);
    
    if (e.message.includes("Failed to fetch")) {
      log("BLOQUEIO DE NAVEGADOR.\nTeste dentro do OBS.");
    }
  }
}

// Inicia o loop
setInterval(atualizarVida, 3000);
atualizarVida();
</script>
</body>
</html>
