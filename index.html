<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Modo Diagnóstico</title>
<style>
  /* CONFIGURAÇÃO DA IMAGEM */
  :root {
    --char-image: url('https://i.imgur.com/8Q5gq0d.png'); 
  }

  body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Arial Black', Impact, sans-serif; }

  /* --- ESTRUTURA VISUAL --- */
  #portrait-container {
    display: flex;
    align-items: center;
    width: 500px;
    height: 180px; /* Aumentei a altura para caber o debug */
    position: relative;
    flex-wrap: wrap;
  }

  #char-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #1a1a1a;
    background-image: var(--char-image);
    background-size: cover;
    background-position: center;
    position: absolute;
    left: 0; top: 5px;
    z-index: 10;
    box-shadow: 3px 0 10px rgba(0,0,0,0.6);
  }

  #bars-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px; 
    margin-left: 70px; 
    margin-top: 5px;
    width: 420px;
    padding: 10px 10px 10px 60px; 
    background: rgba(0,0,0,0.9);
    border-radius: 0 10px 10px 0;
    border: 2px solid #1a1a1a;
    border-left: none; 
  }

  /* --- BARRAS --- */
  .bar-wrapper {
    width: 100%;
    height: 35px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    border: 2px solid #000;
  }
  .bar-fill {
    height: 100%; width: 100%; position: absolute; top: 0; left: 0;
    transition: width 0.3s ease-out;
  }
  #hp-bar .bar-fill { background: linear-gradient(90deg, #800000, #ff0000); }
  #sp-bar .bar-fill { background: linear-gradient(90deg, #000080, #0055ff); }

  .bar-text {
    position: absolute; width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
    color: white; font-size: 24px; font-weight: 900;
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000; z-index: 5;
  }

  /* --- PAINEL DE DEBUG (NOVO) --- */
  #debug-panel {
    width: 100%;
    background: rgba(0, 0, 0, 0.8);
    color: #ffff00; /* Texto Amarelo */
    font-family: monospace;
    font-size: 11px;
    padding: 5px;
    margin-top: 5px;
    border: 1px solid #555;
    white-space: pre-wrap; /* Permite pular linha */
  }
</style>
</head>

<body>

<div id="portrait-container">
  <div id="char-circle"></div>
  
  <div id="bars-container">
    <div id="hp-bar" class="bar-wrapper">
      <div class="bar-fill" id="hp-fill"></div>
      <div class="bar-text" id="hp-text">...</div>
    </div>
    <div id="sp-bar" class="bar-wrapper">
      <div class="bar-fill" id="sp-fill"></div>
      <div class="bar-text" id="sp-text">...</div>
    </div>
  </div>

  <div id="debug-panel">Iniciando diagnóstico...</div>
</div>

    document.getElementById("debug-panel").innerText = msg;
