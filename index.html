<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Trava Absoluta</title>
<style>
  /* === CONFIGURAÇÃO DA IMAGEM === */
  :root {
    --char-image: url('https://i.imgur.com/8Q5gq0d.png'); 
  }

  body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Arial Black', 'Arial Bold', Impact, sans-serif; }

  #portrait-container {
    display: flex;
    align-items: center;
    width: 500px;
    height: 130px;
    position: relative;
  }

  #char-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #1a1a1a;
    background-image: var(--char-image);
    background-size: cover;
    background-position: center;
    position: absolute;
    left: 0;
    z-index: 10;
    box-shadow: 3px 0 10px rgba(0,0,0,0.5);
  }

  #bars-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px; 
    margin-left: 70px; 
    width: 420px;
    padding: 10px 10px 10px 60px; 
    background: rgba(0,0,0,0.85);
    border-radius: 0 10px 10px 0;
    border: 2px solid #1a1a1a;
    border-left: none; 
  }

  .bar-wrapper {
    width: 100%;
    height: 35px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    border: 2px solid #000;
  }

  .bar-fill {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0; left: 0;
    transition: width 0.5s ease-out;
  }

  #hp-bar .bar-fill { background: linear-gradient(90deg, #990000, #ff0000); }
  #sp-bar .bar-fill { background: linear-gradient(90deg, #000099, #0044ff); }

  .bar-text {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 24px;
    font-weight: 900;
    text-shadow: 
       2px  2px 0 #000, -2px  2px 0 #000, 
      -2px -2px 0 #000,  2px -2px 0 #000,
       0px  3px 3px rgba(0,0,0,0.9);
    z-index: 5;
  }
</style>
</head>

<body>

<div id="portrait-container">
  <div id="char-circle"></div>
  
  <div id="bars-container">
    <div id="hp-bar" class="bar-wrapper">
      <div class="bar-fill" id="hp-fill"></div>
      <div class="bar-text" id="hp-text">Carregando...</div>
    </div>
    <div id="sp-bar" class="bar-wrapper">
      <div class="bar-fill" id="sp-fill"></div>
      <div class="bar-text" id="sp-text">--/--</div>
    </div>
  </div>
</div>

<script>
// SEU LINK:
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";

// CLASSE QUE GERENCIA CADA BARRA INDIVIDUALMENTE
class ControladorBarra {
    constructor(idTexto, idBarra) {
        this.elTexto = document.getElementById(idTexto);
        this.elBarra = document.getElementById(idBarra);
        
        this.valorAtualNaTela = -1;
        this.maxAtualNaTela = -1;

        // Lista de Bloqueio (O "Ex" namorado)
        this.valorBloqueado = -1; 
        this.tempoDesbloqueio = 0;
    }

    processar(novoAtual, novoMax) {
        // Se vier zero ou erro, ignora
        if (novoMax <= 0) return;

        // VERIFICAÇÃO 1: É o mesmo valor que já tá na tela?
        if (novoAtual === this.valorAtualNaTela && novoMax === this.maxAtualNaTela) {
            return; // Não faz nada
        }

        // VERIFICAÇÃO 2: Esse valor está bloqueado (é um fantasma)?
        const agora = Date.now();
        if (novoAtual === this.valorBloqueado && agora < this.tempoDesbloqueio) {
            // Console.log("Fantasma bloqueado:", novoAtual);
            return; // IGNORA O ROLLBACK
        }

        // SE PASSOU: É um valor novo e válido!
        
        // 1. Bloqueia o valor antigo (o que estava na tela vira o "ex")
        this.valorBloqueado = this.valorAtualNaTela;
        this.tempoDesbloqueio = agora + 15000; // Bloqueia por 15 segundos

        // 2. Atualiza a tela para o novo
        this.atualizarVisual(novoAtual, novoMax);
        
        // 3. Salva o novo como atual
        this.valorAtualNaTela = novoAtual;
        this.maxAtualNaTela = novoMax;
    }

    atualizarVisual(atual, max) {
        const pct = Math.max(0, Math.min(100, (atual / max) * 100));
        this.elTexto.innerText = `${atual}/${max}`;
        this.elBarra.style.width = pct + "%";
    }
}

// Cria os controles
const ctrlHP = new ControladorBarra('hp-text', 'hp-fill');
const ctrlSP = new ControladorBarra('sp-text', 'sp-fill');

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];
  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

async function loopPrincipal() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    if (res.ok) {
      const csv = await res.text();

      // --- VIDA ---
      const vidaMax = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP", "PV"]);
      let danoHP = encontrarNumero(csv, ["DanoVida", "Dano", "Ferimento"]);
      if (danoHP === null) danoHP = 0;
      
      if (vidaMax !== null) {
          const vidaAtual = Math.max(0, vidaMax - danoHP);
          ctrlHP.processar(vidaAtual, vidaMax);
      }

      // --- SANIDADE / MANA ---
      // Adicionei mais variações de nomes para garantir
      const sanMax = encontrarNumero(csv, ["SanidadeMax", "Sanidade", "ManaMax", "Mana", "PE", "PM", "San", "Mental", "Ocultismo"]);
      let danoSP = encontrarNumero(csv, ["DanoSanidade", "DanoMana", "Gasto", "DanoMental", "DanoPE"]);
      if (danoSP === null) danoSP = 0;

      if (sanMax !== null) {
          const sanAtual = Math.max(0, sanMax - danoSP);
          ctrlSP.processar(sanAtual, sanMax);
      }
    }
  } catch (e) { console.error(e); } 
  finally { 
    // Verifica a cada 1 segundo
    setTimeout(loopPrincipal, 1000); 
  }
}

loopPrincipal();
</script>
</body>
</html>
