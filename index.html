<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG</title>
<style>
  body { margin: 0; background: transparent; font-family: Arial, sans-serif; color: white; overflow: hidden; }
  
  #container {
    width: 320px;
    padding: 10px;
    background: rgba(0,0,0,0.8); /* Um pouco mais escuro para leitura */
    border: 2px solid #b00000;
    border-radius: 5px; /* Borda arredondada visualmente melhor */
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  #vida-texto {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
    text-shadow: 1px 1px 2px black;
  }

  #barra-bg {
    width: 100%;
    height: 24px;
    background: #333;
    border: 2px solid #111;
    border-radius: 3px;
    overflow: hidden; /* Garante que a barra interna não vase */
  }

  #barra-vida {
    height: 100%;
    width: 0%; /* Começa zerado */
    background: linear-gradient(90deg, #ff0000, #ff4444); /* Gradiente para efeito bonito */
    transition: width 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
</style>
</head>

<body>
<div id="container">
  <div id="vida-texto">Carregando...</div>
  <div id="barra-bg">
    <div id="barra-vida"></div>
  </div>
</div>

<script>
// COLE O SEU LINK DA PLANILHA AQUI DENTRO DAS ASPAS
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pubhtml";

function encontrarNumero(csv, palavraChave) {
  const linhas = csv.split('\n');
  const termo = palavraChave.toLowerCase(); 

  for (const linha of linhas) {
    if (linha.toLowerCase().includes(termo)) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/["'%\r]/g, '').trim();
        const n = Number(limpo);
        if (!isNaN(n) && limpo !== "") return n;
      }
    }
  }
  return null;
}

async function atualizarVida() {
  const textoElement = document.getElementById("vida-texto");
  
  try {
    // Tenta baixar a planilha
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    
    // Se o Google retornou erro (ex: 404 não encontrado)
    if (!res.ok) {
      throw new Error(`Erro Google: ${res.status}`);
    }
    
    const csv = await res.text();
    
    // Tenta achar os valores
    const vidaMax = encontrarNumero(csv, "VidaMax"); // Confirme se na planilha está escrito VidaMax
    const dano = encontrarNumero(csv, "Dano");       // Confirme se na planilha está escrito Dano

    if (vidaMax === null) throw new Error("Não achei 'VidaMax'");
    if (dano === null) throw new Error("Não achei 'Dano'");

    // Calcula e atualiza
    const atual = Math.max(0, vidaMax - dano);
    const pct = (atual / vidaMax) * 100;

    textoElement.innerText = `Vida: ${atual} / ${vidaMax}`;
    document.getElementById("barra-vida").style.width = pct + "%";

  } catch (e) {
    console.error(e);
    // Mostra o erro real na tela para podermos consertar
    textoElement.innerText = e.message; 
    textoElement.style.fontSize = "12px"; // Diminui fonte para caber o erro
    textoElement.style.color = "yellow";
  }
}

setInterval(atualizarVida, 2000);
atualizarVida();
</script>
</body>
</html>
