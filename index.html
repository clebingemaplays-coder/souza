<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portrait RPG - Estável</title>
<style>
  /* === CONFIGURAÇÃO DA IMAGEM === */
  /* Coloque o link da sua imagem aqui dentro dos parênteses: */
  :root {
    --char-image: url('https://i.imgur.com/8Q5gq0d.png'); 
  }

  body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Arial Black', 'Arial Bold', Impact, sans-serif; }

  /* Container Principal */
  #portrait-container {
    display: flex;
    align-items: center;
    width: 500px;
    height: 130px;
    position: relative;
  }

  /* Círculo do Personagem */
  #char-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #1a1a1a;
    background-image: var(--char-image);
    background-size: cover;
    background-position: center;
    position: absolute;
    left: 0;
    z-index: 10;
    box-shadow: 3px 0 10px rgba(0,0,0,0.5);
  }

  /* Container das Barras */
  #bars-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px; 
    margin-left: 70px; 
    width: 420px;
    padding: 10px 10px 10px 60px; 
    background: rgba(0,0,0,0.8);
    border-radius: 0 10px 10px 0;
    border: 2px solid #1a1a1a;
    border-left: none; 
  }

  /* Estilo das Barras */
  .bar-wrapper {
    width: 100%;
    height: 35px;
    background: #222;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    border: 2px solid #000;
  }

  .bar-fill {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0; left: 0;
    transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  #hp-bar .bar-fill { background: linear-gradient(90deg, #990000, #ff0000); }
  #sp-bar .bar-fill { background: linear-gradient(90deg, #000099, #0000ff); }

  .bar-text {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 22px;
    font-weight: 900;
    text-shadow: 
       2px  2px 0 #000, -2px  2px 0 #000, 
      -2px -2px 0 #000,  2px -2px 0 #000,
       0px  3px 3px rgba(0,0,0,0.8);
    z-index: 5;
  }
</style>
</head>

<body>

<div id="portrait-container">
  <div id="char-circle"></div>
  
  <div id="bars-container">
    <div id="hp-bar" class="bar-wrapper">
      <div class="bar-fill" id="hp-fill"></div>
      <div class="bar-text" id="hp-text">--/--</div>
    </div>
    <div id="sp-bar" class="bar-wrapper">
      <div class="bar-fill" id="sp-fill"></div>
      <div class="bar-text" id="sp-text">--/--</div>
    </div>
  </div>
</div>

<script>
// SEU LINK DA PLANILHA:
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTANyBjzDtkaYb-7DLXqfMC4nqQIC5GawVzHTylxnSX7DPGhPKxmYvrWXuVdYGkTwtKHCqKC_iRPPUw/pub?gid=1156002832&single=true&output=csv";

// CLASSE DE ESTABILIDADE (Filtra os fantasmas)
class Estabilizador {
    constructor() {
        this.historico = [];
        this.tamanhoBuffer = 5; // Olha as ultimas 5 leituras
    }

    adicionar(valor) {
        // Se vier valor inválido, ignora
        if (valor === null || isNaN(valor)) return;

        this.historico.push(valor);
        // Mantém apenas os ultimos X
        if (this.historico.length > this.tamanhoBuffer) {
            this.historico.shift();
        }
    }

    obterValorConsenso() {
        // Se não tiver dados suficientes ainda, retorna nulo
        if (this.historico.length < 3) return null;

        // Conta quantas vezes cada valor apareceu
        const contagem = {};
        let maxAparicoes = 0;
        let valorVencedor = null;

        for (const v of this.historico) {
            contagem[v] = (contagem[v] || 0) + 1;
            if (contagem[v] > maxAparicoes) {
                maxAparicoes = contagem[v];
                valorVencedor = v;
            }
        }

        // SÓ ACEITA MUDAR SE:
        // O valor vencedor apareceu em pelo menos 4 das ultimas 5 leituras (80% de certeza)
        if (maxAparicoes >= 4) {
            return Number(valorVencedor);
        }
        
        return null; // Sem consenso (está piscando), mantém o anterior
    }
}

// Criar estabilizadores para Vida e Sanidade
const estabilizadorHP = new Estabilizador();
const estabilizadorSP = new Estabilizador();
const estabilizadorMaxHP = new Estabilizador();
const estabilizadorMaxSP = new Estabilizador();

// Variaveis de tela atuais
let telaHP = -1; let telaMaxHP = -1;
let telaSP = -1; let telaMaxSP = -1;

function encontrarNumero(csv, listaDeNomes) {
  const linhas = csv.split('\n');
  const nomes = Array.isArray(listaDeNomes) ? listaDeNomes : [listaDeNomes];
  for (const linha of linhas) {
    const linhaLow = linha.toLowerCase();
    if (nomes.some(nome => linhaLow.includes(nome.toLowerCase()))) {
      const partes = linha.split(/[,;]/);
      for (const p of partes) {
        const limpo = p.replace(/[^0-9.-]/g, '').trim();
        if (limpo === "") continue;
        const n = Number(limpo);
        if (!isNaN(n)) return n;
      }
    }
  }
  return null;
}

function atualizarTela(tipo, atual, max) {
    const idText = tipo === 'hp' ? 'hp-text' : 'sp-text';
    const idFill = tipo === 'hp' ? 'hp-fill' : 'sp-fill';
    
    // Atualiza texto e barra
    const pct = Math.max(0, Math.min(100, (atual / max) * 100));
    document.getElementById(idText).innerText = `${atual}/${max}`;
    document.getElementById(idFill).style.width = pct + "%";
}

async function loopPrincipal() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now());
    if (res.ok) {
      const csv = await res.text();

      // --- LER DADOS BRUTOS ---
      const vidaMaxRaw = encontrarNumero(csv, ["VidaMax", "Vida Max", "Vida", "HP"]);
      let danoHP = encontrarNumero(csv, ["DanoVida", "Dano", "Ferimento"]);
      if (danoHP === null) danoHP = 0;
      
      const sanMaxRaw = encontrarNumero(csv, ["SanidadeMax", "Sanidade", "ManaMax", "Mana", "PE"]);
      let danoSP = encontrarNumero(csv, ["DanoSanidade", "DanoMana", "Gasto"]);
      if (danoSP === null) danoSP = 0;

      // --- PROCESSAR VIDA ---
      if (vidaMaxRaw !== null) {
          const vidaAtualRaw = Math.max(0, vidaMaxRaw - danoHP);
          
          // Joga no estabilizador
          estabilizadorHP.adicionar(vidaAtualRaw);
          estabilizadorMaxHP.adicionar(vidaMaxRaw);

          // Pede o consenso
          const hpConfiavel = estabilizadorHP.obterValorConsenso();
          const maxHpConfiavel = estabilizadorMaxHP.obterValorConsenso();

          // Se tem um valor confiável E ele é diferente da tela, atualiza
          if (hpConfiavel !== null && maxHpConfiavel !== null) {
              if (hpConfiavel !== telaHP || maxHpConfiavel !== telaMaxHP) {
                  atualizarTela('hp', hpConfiavel, maxHpConfiavel);
                  telaHP = hpConfiavel;
                  telaMaxHP = maxHpConfiavel;
              }
          }
      }

      // --- PROCESSAR SANIDADE ---
      if (sanMaxRaw !== null) {
          const sanAtualRaw = Math.max(0, sanMaxRaw - danoSP);
          
          estabilizadorSP.adicionar(sanAtualRaw);
          estabilizadorMaxSP.adicionar(sanMaxRaw);

          const spConfiavel = estabilizadorSP.obterValorConsenso();
          const maxSpConfiavel = estabilizadorMaxSP.obterValorConsenso();

          if (spConfiavel !== null && maxSpConfiavel !== null) {
              if (spConfiavel !== telaSP || maxSpConfiavel !== telaMaxSP) {
                  atualizarTela('sp', spConfiavel, maxSpConfiavel);
                  telaSP = spConfiavel;
                  telaMaxSP = maxSpConfiavel;
              }
          }
      }
    }
  } catch (e) { console.error(e); } 
  finally { 
    // Repete a cada 400ms (A estabilidade de 5 frames leva ~2s)
    setTimeout(loopPrincipal, 400); 
  }
}

loopPrincipal();
</script>
</body>
</html>
