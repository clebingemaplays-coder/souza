<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Overlay RPG - V3</title>
    <style>
        /* --- ESTILO VISUAL --- */
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: transparent; 
            color: white; 
            overflow: hidden;
            margin: 0; padding: 10px;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            width: fit-content;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .portrait {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #b22222;
            overflow: hidden;
            flex-shrink: 0;
            background: #000;
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 200px;
        }

        .name {
            font-size: 18px; /* Ajustei levemente para caber nomes maiores */
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-box {
            position: relative;
            background: #222;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #000;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            transition: width 0.5s ease-in-out;
        }

        .hp-fill { background: linear-gradient(90deg, #8b0000, #ff3333); width: 100%; }
        .mp-fill { background: linear-gradient(90deg, #00008b, #3333ff); width: 100%; }

        .bar-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="portrait">
            <img src="https://i.imgur.com/your-image.png" id="char-image" alt="Foto">
        </div>
        
        <div class="info">
            <div class="name" id="char-name">Carregando...</div>
            
            <div class="bar-box">
                <div class="bar-text">HP: <span id="hp-txt">0/0</span></div>
                <div class="bar hp-fill" id="hp-bar"></div>
            </div>

            <div class="bar-box">
                <div class="bar-text">MP: <span id="mp-txt">0/0</span></div>
                <div class="bar mp-fill" id="mp-bar"></div>
            </div>
        </div>
    </div>
